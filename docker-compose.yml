services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-chatbot-telegram
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # Necessário para o workflow conseguir ler $env.OPENWEATHER_API_KEY
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # URL pública HTTPS (ngrok / Cloudflare Tunnel) — o Telegram só envia webhooks para HTTPS
      - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
